            var any = false, list = navigator.getGamepads ? navigator.getGamepads() : [];

              for (var b = 0; b < gp.buttons.length; b++) if (gp.buttons[b].pressed) any = true;
            }
            if (any && !held) next();
            held = any;
            pad = requestAnimationFrame(poll);
          }
          addEventListener('keydown', input, true);
          addEventListener('pointerdown', input, true);
          addEventListener('gamepadconnected', function () { if (!pad && !done) pad = requestAnimationFrame(poll); });
